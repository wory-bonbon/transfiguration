<script>
/* =========================================================================
   TRANSFIGURATION — 多面体変相
     p(v,w) = M·( v + τ(w−v) )   apex = C + σ·R_f·N   M = diag(s^-1/2,s,s^-1/2)
   ========================================================================= */
const V3 = THREE.Vector3;
const PHI = (1 + Math.sqrt(5)) / 2;

/* ---------- 1. 多面体 ----------------------------------------------------- */
function fixWinding(V,F){
  const n=new V3(), c=new V3();
  for(const f of F){
    n.set(0,0,0); c.set(0,0,0);
    for(let i=0;i<f.length;i++){
      const p=V[f[i]], q=V[f[(i+1)%f.length]];
      n.x+=(p.y-q.y)*(p.z+q.z); n.y+=(p.z-q.z)*(p.x+q.x); n.z+=(p.x-q.x)*(p.y+q.y);
      c.add(p);
    }
    if(n.dot(c)<0) f.reverse();
  }
}
function icosahedron(){
  const raw=[[0,1,PHI],[0,1,-PHI],[0,-1,PHI],[0,-1,-PHI],
             [1,PHI,0],[1,-PHI,0],[-1,PHI,0],[-1,-PHI,0],
             [PHI,0,1],[-PHI,0,1],[PHI,0,-1],[-PHI,0,-1]];
  const V = raw.map(p=>new V3(p[0],p[1],p[2]));
  const n=V.length, d2=(a,b)=>V[a].distanceToSquared(V[b]);
  let min=Infinity;
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++) min=Math.min(min,d2(i,j));
  const isE=(a,b)=>Math.abs(d2(a,b)-min)<1e-6;
  const F=[];
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)for(let k=j+1;k<n;k++)
    if(isE(i,j)&&isE(j,k)&&isE(i,k)) F.push([i,j,k]);
  fixWinding(V,F); return {V,F};
}
function topology(P){
  const {V,F}=P, dirFace=new Map();
  F.forEach((f,fi)=>{ for(let i=0;i<f.length;i++) dirFace.set(f[i]+','+f[(i+1)%f.length],fi); });
  const nextIn=(fi,v)=>{ const f=F[fi]; return f[(f.indexOf(v)+1)%f.length]; };
  const start=V.map(()=>-1);
  F.forEach((f,fi)=>f.forEach(v=>{ if(start[v]<0) start[v]=fi; }));
  const nbrs=[], fcyc=[];
  V.forEach((_,v)=>{
    const nb=[], fc=[]; let fi=start[v], g=0;
    do{ fc.push(fi); const w=nextIn(fi,v); nb.push(w); fi=dirFace.get(w+','+v); }
    while(fi!==start[v] && ++g<24);
    nbrs.push(nb); fcyc.push(fc);
  });
  return {nbrs,fcyc};
}
function dual(P,T){
  const V=P.F.map(f=>{ const c=new V3(); f.forEach(i=>c.add(P.V[i]));
                       return c.divideScalar(f.length).normalize(); });
  const F=T.fcyc.map(fc=>fc.slice());
  fixWinding(V,F); return {V,F};
}
function normalizeMidradius(P){
  const seen=new Set(); let s=0,n=0;
  for(const f of P.F) for(let i=0;i<f.length;i++){
    const a=f[i], b=f[(i+1)%f.length], k=Math.min(a,b)+'_'+Math.max(a,b);
    if(seen.has(k)) continue; seen.add(k);
    s += P.V[a].clone().add(P.V[b]).multiplyScalar(0.5).length(); n++;
  }
  P.V.forEach(v=>v.multiplyScalar(n/s)); return P;
}
function truncation(P,T){
  const idx=new Map(), pairs=[];
  P.V.forEach((_,v)=>T.nbrs[v].forEach(w=>{ idx.set(v+','+w,pairs.length); pairs.push([v,w]); }));
  const faces=[], kind=[];
  P.F.forEach(f=>{ const p=[];
    for(let i=0;i<f.length;i++){ const a=f[i], b=f[(i+1)%f.length];
      p.push(idx.get(a+','+b), idx.get(b+','+a)); }
    faces.push(p); kind.push(0); });
  P.V.forEach((_,v)=>{ faces.push(T.nbrs[v].map(w=>idx.get(v+','+w))); kind.push(1); });
  const S=pairs.map(pr=>P.V[pr[0]].clone().lerp(P.V[pr[1]],0.25));
  fixWinding(S,faces);
  return {faces,kind,pairs};
}

/* ---------- 2. 描画モデル ------------------------------------------------ */
const INSET=0.905;
function buildModel(base){
  const T=topology(base), K=truncation(base,T), nP=K.pairs.length;
  let tri=0, seg=0; K.faces.forEach(f=>{ tri+=f.length; seg+=f.length; });
  const pos=new Float32Array(tri*9), nor=new Float32Array(tri*9);
  const aRim=new Float32Array(tri*3), aType=new Float32Array(tri*3);
  const lpos=new Float32Array(seg*6), ppos=new Float32Array(nP*3);
  { let o=0; K.faces.forEach((f,fi)=>{ for(let i=0;i<f.length;i++){
      aRim[o]=1; aRim[o+1]=0; aRim[o+2]=0;
      aType[o]=aType[o+1]=aType[o+2]=K.kind[fi]; o+=3; } }); }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('normal',  new THREE.BufferAttribute(nor,3));
  g.setAttribute('aRim',    new THREE.BufferAttribute(aRim,1));
  g.setAttribute('aType',   new THREE.BufferAttribute(aType,1));
  const gl=new THREE.BufferGeometry();
  gl.setAttribute('position',new THREE.BufferAttribute(lpos,3));
  const gp=new THREE.BufferGeometry();
  gp.setAttribute('position',new THREE.BufferAttribute(ppos,3));

  const P=[]; for(let i=0;i<nP;i++) P.push(new V3());
  const Q=[]; for(let i=0;i<12;i++) Q.push(new V3());
  const C=new V3(), N=new V3(), tmp=new V3(), rot=new V3(),
        AP=new V3(), e1=new V3(), e2=new V3(), tn=new V3();
  let maxR=0;

  function update(tau, sigma, st, chaos){
    const pairs=K.pairs, faces=K.faces;
    const sy=st, sxz=1/Math.sqrt(st);
    maxR=0;
    for(let i=0;i<nP;i++){
      const a=base.V[pairs[i][0]], b=base.V[pairs[i][1]];
      P[i].set((a.x+(b.x-a.x)*tau)*sxz, (a.y+(b.y-a.y)*tau)*sy, (a.z+(b.z-a.z)*tau)*sxz);
      ppos[i*3]=P[i].x; ppos[i*3+1]=P[i].y; ppos[i*3+2]=P[i].z;
      maxR=Math.max(maxR,P[i].length());
    }
    const inset=INSET-0.115*chaos, lift=0.115*chaos, th=0.34*chaos;
    const cs=Math.cos(th), sn=Math.sin(th);
    let o=0, lo=0;
    for(let fi=0; fi<faces.length; fi++){
      const f=faces[fi], m=f.length;
      C.set(0,0,0); for(let i=0;i<m;i++) C.add(P[f[i]]); C.divideScalar(m);
      N.set(0,0,0);
      for(let i=0;i<m;i++){ const p=P[f[i]], q=P[f[(i+1)%m]];
        N.x+=(p.y-q.y)*(p.z+q.z); N.y+=(p.z-q.z)*(p.x+q.x); N.z+=(p.x-q.x)*(p.y+q.y); }
      if(N.lengthSq()<1e-12) N.copy(C);
      N.normalize(); if(N.dot(C)<0) N.negate();
      const cx=C.x+N.x*lift, cy=C.y+N.y*lift, cz=C.z+N.z*lift;
      while(Q.length<m) Q.push(new V3());
      let Rf=0;
      for(let i=0;i<m;i++){
        tmp.subVectors(P[f[i]],C).multiplyScalar(inset);
        rot.crossVectors(N,tmp);
        Q[i].set(cx+tmp.x*cs+rot.x*sn, cy+tmp.y*cs+rot.y*sn, cz+tmp.z*cs+rot.z*sn);
        Rf=Math.max(Rf, tmp.length());
      }
      AP.set(cx+N.x*sigma*Rf, cy+N.y*sigma*Rf, cz+N.z*sigma*Rf);
      maxR=Math.max(maxR, AP.length());
      for(let i=0;i<m;i++){
        const A=Q[i], B=Q[(i+1)%m];
        e1.subVectors(A,AP); e2.subVectors(B,AP);
        tn.crossVectors(e1,e2);
        if(tn.lengthSq()<1e-14) tn.copy(N); else {
          tn.normalize();
          if(tn.x*(AP.x+A.x+B.x)+tn.y*(AP.y+A.y+B.y)+tn.z*(AP.z+A.z+B.z) < 0) tn.negate();
        }
        pos[o]=AP.x; pos[o+1]=AP.y; pos[o+2]=AP.z;
        pos[o+3]=A.x; pos[o+4]=A.y; pos[o+5]=A.z;
        pos[o+6]=B.x; pos[o+7]=B.y; pos[o+8]=B.z;
        for(let j=0;j<3;j++){ nor[o+j*3]=tn.x; nor[o+j*3+1]=tn.y; nor[o+j*3+2]=tn.z; }
        o+=9;
        lpos[lo]=A.x; lpos[lo+1]=A.y; lpos[lo+2]=A.z;
        lpos[lo+3]=B.x; lpos[lo+4]=B.y; lpos[lo+5]=B.z;
        lo+=6;
      }
    }
    g.attributes.position.needsUpdate=true; g.attributes.normal.needsUpdate=true;
    gl.attributes.position.needsUpdate=true; gp.attributes.position.needsUpdate=true;
    g.computeBoundingSphere();
  }
  return {geom:g, lineGeom:gl, pointGeom:gp, update, radius:()=>maxR, K, base};
}

/* 代表面を 1 枚ずつ取り出して 2D に開く（piece 表示用） */
function facePieces(M, tau, sigma, st){
  const K=M.K, base=M.base, sy=st, sxz=1/Math.sqrt(st);
  const P=K.pairs.map(pr=>{
    const a=base.V[pr[0]], b=base.V[pr[1]];
    return new V3((a.x+(b.x-a.x)*tau)*sxz,(a.y+(b.y-a.y)*tau)*sy,(a.z+(b.z-a.z)*tau)*sxz);
  });
  const out=[];
  [0,1].forEach(kind=>{
    const fi=K.kind.indexOf(kind); if(fi<0) return;
    const f=K.faces[fi], m=f.length;
    const C=new V3(); f.forEach(i=>C.add(P[i])); C.divideScalar(m);
    const N=new V3();
    for(let i=0;i<m;i++){ const p=P[f[i]], q=P[f[(i+1)%m]];
      N.x+=(p.y-q.y)*(p.z+q.z); N.y+=(p.z-q.z)*(p.x+q.x); N.z+=(p.x-q.x)*(p.y+q.y); }
    if(N.lengthSq()<1e-12) return;
    N.normalize(); if(N.dot(C)<0) N.negate();
    /* 重複頂点を畳む（τ=0 / 0.5 で 2n 角形が n 角形へ退化する） */
    const raw=[];
    for(let i=0;i<m;i++){
      const q=P[f[i]].clone().sub(C).multiplyScalar(INSET);
      if(raw.length===0 || q.distanceTo(raw[raw.length-1])>1e-5) raw.push(q);
    }
    if(raw.length>1 && raw[0].distanceTo(raw[raw.length-1])<1e-5) raw.pop();
    if(raw.length<3) return;
    let Rf=0; raw.forEach(q=>Rf=Math.max(Rf,q.length()));
    let pts;
    if(sigma>1e-3){                      /* 星形時の実際の構成面＝角錐の側面三角形 */
      const ap=N.clone().multiplyScalar(sigma*Rf);
      pts=[ap, raw[0], raw[1]];
    } else pts=raw;
    /* 面内の直交基底へ射影 */
    const o=new V3(); pts.forEach(p=>o.add(p)); o.divideScalar(pts.length);
    let ex=null;
    for(let i=0;i<pts.length && !ex;i++){
      const d=pts[(i+1)%pts.length].clone().sub(pts[i]);
      if(d.lengthSq()>1e-8) ex=d.normalize();
    }
    if(!ex) return;
    const nn=pts.length===3
      ? pts[1].clone().sub(pts[0]).cross(pts[2].clone().sub(pts[0])).normalize()
      : N.clone();
    const ey=nn.clone().cross(ex).normalize();
    let p2=pts.map(p=>{ const d=p.clone().sub(o); return [d.dot(ex), d.dot(ey)]; });
    /* 向きの正準化：反時計回りに揃え、第1頂点を真上に固定する */
    let A2=0;
    for(let i=0;i<p2.length;i++){ const a=p2[i], b=p2[(i+1)%p2.length];
      A2 += a[0]*b[1] - b[0]*a[1]; }
    if(A2<0) p2=p2.map(q=>[q[0], -q[1]]);
    const th0=Math.atan2(p2[0][1], p2[0][0]), rr=Math.PI/2-th0;
    const cr=Math.cos(rr), sr=Math.sin(rr);
    p2=p2.map(q=>[q[0]*cr-q[1]*sr, q[0]*sr+q[1]*cr]);
    out.push(p2);
  });
  return out;
}

/* ---------- 3. 共通シェーダ関数（GLSL 断片） ------------------------------ */
const GLSL_LIB = `
vec3 thinFilm(float cosI, float d){
  float n = 1.42;
  float cosT = sqrt(max(1.0 - (1.0 - cosI*cosI)/(n*n), 0.0));
  float delta = 2.0 * n * d * cosT;
  return 0.5 - 0.5*cos(6.2831853*delta/vec3(612.0,549.0,464.0) + 3.1415927);
}
float lobe(vec3 R, vec3 L, float p){ return pow(max(dot(R, normalize(L)), 0.0), p); }
vec3 pearlSky(vec3 R, float t){
  float h = R.y*0.5 + 0.5;
  float drift = 0.5*sin(R.x*2.4 + t*0.19) + 0.5*sin(R.z*2.9 - t*0.15);
  float v = clamp(h + drift*0.14, 0.0, 1.0);
  vec3 c =      vec3(1.00,0.88,0.79);
  c = mix(c, vec3(1.00,0.82,0.87), smoothstep(0.02,0.24,v));
  c = mix(c, vec3(0.86,0.81,1.00), smoothstep(0.22,0.44,v));
  c = mix(c, vec3(0.73,0.90,1.00), smoothstep(0.42,0.62,v));
  c = mix(c, vec3(0.80,1.00,0.95), smoothstep(0.60,0.80,v));
  c = mix(c, vec3(1.00,0.98,0.93), smoothstep(0.78,1.00,v));
  float curtain = pow(max(sin(v*8.0 + drift*1.7 + t*0.30), 0.0), 1.5);
  float veil    = pow(max(sin(v*3.0 - t*0.10), 0.0), 1.2);
  float horizon = exp(-pow(R.y*5.5, 2.0));
  return c * (0.40 + 0.68*curtain + 0.28*veil) + vec3(0.85,0.90,1.0)*horizon*0.22;
}
vec3 specular(vec3 R){
  vec3 s = vec3(0.0);
  s += vec3(1.00,0.98,0.95) * lobe(R, vec3( 0.32, 0.88, 0.35), 1400.0) * 5.2;
  s += vec3(0.92,0.96,1.00) * lobe(R, vec3(-0.72, 0.26, 0.64),  320.0) * 1.9;
  s += vec3(1.00,0.90,0.86) * lobe(R, vec3( 0.12,-0.74,-0.66),  160.0) * 1.2;
  s += vec3(0.95,1.00,0.98) * lobe(R, vec3(-0.15, 0.10,-0.98), 2600.0) * 3.4;
  return s;
}`;

const FILM_VS = `
attribute float aRim; attribute float aType;
varying vec3 vN; varying vec3 vW; varying float vRim; varying float vType;
void main(){
  vec4 wp = modelMatrix * vec4(position,1.0);
  vW = wp.xyz;
  vN = normalize(mat3(modelMatrix) * normal);
  vRim = aRim; vType = aType;
  gl_Position = projectionMatrix * viewMatrix * wp;
}`;
const FILM_FS = `
precision highp float;
uniform float uTime, uChaos;
varying vec3 vN; varying vec3 vW; varying float vRim; varying float vType;
` + GLSL_LIB + `
void main(){
  vec3 N = normalize(vN);
  vec3 V = normalize(cameraPosition - vW);
  if(!gl_FrontFacing) N = -N;
  float ndv  = clamp(dot(N,V), 0.0, 1.0);
  float fres = 0.05 + 0.95*pow(1.0-ndv, 5.0);
  vec3  R    = reflect(-V, N);
  float d = 330.0 + 145.0*sin(vW.y*2.0 + vW.x*0.9 + uTime*0.16)
                  +  90.0*sin(vW.z*3.2 - uTime*0.11)
                  +  50.0*vType + 55.0*uChaos;
  vec3 film = mix(vec3(1.0), thinFilm(ndv, d), 0.62);
  vec3 sky  = pearlSky(R, uTime);
  vec3 spec = specular(R) * film;
  vec3 col  = film * sky * 1.80 + sky * fres * 0.60 + film * 0.09;
  col += spec * (0.30 + 0.70*fres);
  float edge = pow(1.0 - vRim, 10.0);
  col += vec3(1.00,0.96,0.94) * edge * (0.22 + 0.55*uChaos);
  float sl = dot(spec, vec3(0.2126,0.7152,0.0722));
  float a = clamp(0.075 + 0.55*fres + 0.40*edge + 0.30*min(sl,1.0), 0.0, 1.0);
  gl_FragColor = vec4(col, a);
}`;

/* piece：平面だがわずかにドーム状の法線を与えてハイライトを走らせる */
const PIECE_VS = `
attribute vec2 aLoc;
varying vec2 vLoc; varying vec3 vN; varying vec3 vW;
void main(){
  vLoc = aLoc;
  vec3 n = normalize(vec3(aLoc.x*1.25, aLoc.y*1.25, 1.0));
  vN = normalize(mat3(modelMatrix) * n);
  vec4 wp = modelMatrix * vec4(position,1.0);
  vW = wp.xyz;
  gl_Position = projectionMatrix * viewMatrix * wp;
}`;
const PIECE_FS = `
precision highp float;
uniform float uTime, uOpacity, uTop, uBot;
varying vec2 vLoc; varying vec3 vN; varying vec3 vW;
` + GLSL_LIB + `
void main(){
  if(vLoc.y > uTop || vLoc.y < uBot) discard;
  vec3 N = normalize(vN);
  vec3 V = normalize(cameraPosition - vW);
  if(!gl_FrontFacing) N = -N;
  float ndv  = clamp(dot(N,V), 0.0, 1.0);
  float fres = 0.05 + 0.95*pow(1.0-ndv, 5.0);
  vec3  R    = reflect(-V, N);
  float d = 330.0 + 150.0*sin(vLoc.x*2.6 + vLoc.y*1.9 + uTime*0.42);
  vec3 film = mix(vec3(1.0), thinFilm(ndv, d), 0.62);
  vec3 sky  = pearlSky(R, uTime);
  vec3 spec = specular(R) * film;
  vec3 col  = film * sky * 1.80 + sky * fres * 0.60 + film * 0.09;
  col += spec * (0.30 + 0.70*fres);
  float eT = exp(-abs(vLoc.y-uTop)*70.0);
  float eB = exp(-abs(vLoc.y-uBot)*70.0);
  col += vec3(0.86,0.94,1.00) * (eT+eB) * 0.42;
  float sl = dot(spec, vec3(0.2126,0.7152,0.0722));
  float a = clamp(0.40 + 0.34*fres + 0.28*min(sl,1.0) + 0.45*(eT+eB), 0.0, 1.0) * uOpacity;
  gl_FragColor = vec4(col, a);
}`;

const TEXT_VS = `
varying vec2 vUv; varying vec3 vN; varying vec3 vW;
void main(){ vUv=uv; vN=normal; vW=position;
  gl_Position = projectionMatrix * viewMatrix * vec4(position,1.0); }`;
const TEXT_FS = `
precision highp float;
uniform sampler2D tText; uniform float uOpacity; uniform float uOffset; uniform float uFlat;
varying vec2 vUv; varying vec3 vN; varying vec3 vW;
void main(){
  vec4 c = texture2D(tText, vec2(vUv.x + uOffset, vUv.y));
  float f = dot(normalize(vN), normalize(cameraPosition - vW));
  float face = mix(smoothstep(-0.02, 0.34, f), 1.0, uFlat);
  float a = c.a * uOpacity * face;
  if(a < 0.004) discard;
  gl_FragColor = vec4(vec3(1.0), a);
}`;

const SCAN_VS = `varying vec2 vUv; void main(){ vUv=uv;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`;
const SCAN_FS = `
precision highp float; uniform float uOpacity; varying vec2 vUv;
void main(){
  float g = exp(-pow((vUv.y-0.5)*9.5, 2.0));
  float ends = smoothstep(0.0,0.06,vUv.x)*smoothstep(1.0,0.94,vUv.x);
  gl_FragColor = vec4(vec3(0.84,0.93,1.00), g*ends*uOpacity);
}`;

const QUAD_VS = `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }`;
const COMP_FS = `
precision highp float;
uniform sampler2D tBase; uniform float uTime; uniform vec2 uRes;
varying vec2 vUv;
vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14), 0.0, 1.0); }
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
void main(){
  vec3 base = texture2D(tBase, vUv).rgb;
  float r = length((vUv-0.5)*vec2(uRes.x/uRes.y,1.0));
  vec3 bg = mix(vec3(0.052,0.050,0.062), vec3(0.004,0.004,0.008), smoothstep(0.05,0.95,r));
  bg += vec3(0.030,0.028,0.036) * pow(max(1.0-r*1.35,0.0), 3.0);
  vec3 col = bg + base;
  col = aces(col * 1.04);
  col *= 1.0 - 0.40*smoothstep(0.35,1.05,r);
  col += (hash(vUv*uRes + fract(uTime)*137.0) - 0.5) * 0.028;
  gl_FragColor = vec4(col, 1.0);
}`;

      _te=new THREE.Euler(),_a=new V3(),_b=new V3();
function updateRing(m, ringR, capY, t){
  _te.set(0.34+0.07*Math.sin(t*0.21), t*0.17, -0.13+0.06*Math.cos(t*0.17));
  _tq.setFromEuler(_te);
  camera.updateMatrixWorld();
  _cr.setFromMatrixColumn(camera.matrixWorld,0).normalize();
  _cu.setFromMatrixColumn(camera.matrixWorld,1).normalize();
  _cd.setFromMatrixColumn(camera.matrixWorld,2).normalize();
  const hRing=RING_AR*2*Math.PI*ringR, hFlat=RING_AR*CAP_WORLD_W;
  const h=hRing+(hFlat-hRing)*m;
  _fc.set(0, capY, 0);
  for(let i=0;i<=RING_N;i++){
    const u=i/RING_N, th=u*Math.PI*2;
    _p.set(Math.cos(th)*ringR,0,Math.sin(th)*ringR).applyQuaternion(_tq); _p.y+=OBJ_Y;
    _ax.set(0,1,0).applyQuaternion(_tq);
    _no.set(Math.cos(th),0,Math.sin(th)).applyQuaternion(_tq);
    _fp.copy(_cr).multiplyScalar((u-0.5)*CAP_WORLD_W).add(_fc);
    const px=_p.x+(_fp.x-_p.x)*m, py=_p.y+(_fp.y-_p.y)*m, pz=_p.z+(_fp.z-_p.z)*m;
    _a.set(_ax.x+(_cu.x-_ax.x)*m,_ax.y+(_cu.y-_ax.y)*m,_ax.z+(_cu.z-_ax.z)*m).normalize();
    _b.set(_no.x+(_cd.x-_no.x)*m,_no.y+(_cd.y-_no.y)*m,_no.z+(_cd.z-_no.z)*m).normalize();
    const o0=(i*2)*3,o1=(i*2+1)*3;
    ringPos[o0]=px+_a.x*h*0.5; ringPos[o0+1]=py+_a.y*h*0.5; ringPos[o0+2]=pz+_a.z*h*0.5;
    ringPos[o1]=px-_a.x*h*0.5; ringPos[o1+1]=py-_a.y*h*0.5; ringPos[o1+2]=pz-_a.z*h*0.5;
    ringNor[o0]=_b.x; ringNor[o0+1]=_b.y; ringNor[o0+2]=_b.z;
    ringNor[o1]=_b.x; ringNor[o1+1]=_b.y; ringNor[o1+2]=_b.z;
  }
  ringGeo.attributes.position.needsUpdate=true;
  ringGeo.attributes.normal.needsUpdate=true;
}

function rebuildPieces(key, boxHalf){
  const S=PIECE_STATE[key];
  if(!S){ pieceGeo.setDrawRange(0,0); return; }
  let raw=facePieces(MODEL[S.b], S.t, S.g, S.s);
  if(!raw.length){ pieceGeo.setDrawRange(0,0); return; }
  /* 大きい順に並べて左右の配置を固定する */
  raw=raw.map(p=>{ let r=0; p.forEach(q=>r=Math.max(r,Math.hypot(q[0],q[1]))); return {p:p,r:r}; })
         .sort((a,b)=>b.r-a.r);
  const polys=raw.map(o=>o.p), rad=raw.map(o=>o.r);
  const maxR=Math.max.apply(null,rad);
  const gap=maxR*0.42;
  let total=0; rad.forEach(r=>total+=2*r); total+=gap*(polys.length-1);
  const k=boxHalf/Math.max(total/2, maxR*1.02);
  let cur=-total/2, n=0;
  const hy=maxR*k;
  polys.forEach((p,i)=>{
    const ox=(cur+rad[i])*k; cur+=2*rad[i]+gap;
    const cx=0, cy=0;
    for(let j=0;j<p.length;j++){
      const a=p[j], b=p[(j+1)%p.length];
      const tri=[[cx,cy],[a[0],a[1]],[b[0],b[1]]];
      for(const v of tri){
        if(n>=PIECE_MAX) break;
        const X=ox+v[0]*k, Y=v[1]*k;
        piecePos[n*3]=X; piecePos[n*3+1]=Y; piecePos[n*3+2]=0;
        pieceLoc[n*2]=X/boxHalf; pieceLoc[n*2+1]=Y/Math.max(hy,1e-4);
        n++;
      }
    }
  });
  pieceGeo.attributes.position.needsUpdate=true;
  pieceGeo.attributes.aLoc.needsUpdate=true;
  pieceGeo.setDrawRange(0,n);
  pieceHalfY=hy; pieceHalfX=total/2*k;
}

 {b:'dod', A:{t:TD,  g:0,   s:SP}, B:{t:TD,  g:0,   s:SO}, fk:'col', tk:'obl'},
 {b:'dod', A:{t:TD,  g:0,   s:SO}, B:{t:0,   g:0,   s:1 }, fk:'obl', tk:'dod'},
];
const SEG_DUR=6.4;
let phase=0, dir=1, paused=false, objRadius=1.30, lockAmt=1, scrollOff=0;
let curM=null, curTau=0, curSig=0, curSt=1, curChaos=0;
const smoother=x=>x*x*x*(x*(x*6-15)+10);
const elTau=document.getElementById('tau');

function applySequence(dt){
  if(!paused) phase += (dt/SEG_DUR)*dir;
  if(phase>=SEGS.length){ phase=SEGS.length-(phase-SEGS.length); dir=-1; }
  if(phase<0){ phase=-phase; dir=1; }
  const si=Math.min(SEGS.length-1, Math.max(0, Math.floor(phase)));
  const g=SEGS[si];
  const raw=Math.min(1, Math.max(0, phase-si));
  const u=smoother(Math.min(1, Math.max(0,(raw-0.20)/0.60)));
  const chaos=Math.sin(Math.PI*u);
  const tau=g.A.t+(g.B.t-g.A.t)*u;
  const sig=g.A.g+(g.B.g-g.A.g)*u;
  const st =Math.exp(Math.log(g.A.s)+(Math.log(g.B.s)-Math.log(g.A.s))*u);

  MODEL.ico.group.visible=(g.b==='ico');
  MODEL.dod.group.visible=(g.b==='dod');
  const M=MODEL[g.b];
  M.update(tau, sig, st, chaos);
  const k=Math.pow(TARGET_R/Math.max(M.radius(),1e-3), 0.74);
  root.scale.setScalar(k);
  objRadius=M.radius()*k;
  filmMat.uniforms.uChaos.value=chaos;
  curM=M; curTau=tau; curSig=sig; curSt=st; curChaos=chaos;

  lockAmt = smoother(Math.min(1, Math.max(0, 1 - 5.5*Math.min(u, 1-u))));
  const key=(u<0.5)?g.fk:g.tk;
  if(key!==capKey){ capKey=key; capSprite.material.map=CAP_TEX[key];
                    capSprite.material.needsUpdate=true; }
  elTau.innerHTML='τ <b>'+tau.toFixed(3)+'</b>　σ <b>'+sig.toFixed(3)+'</b>　s <b>'+st.toFixed(3)+'</b>';
}

/* ---------- 12. Sonification ---------------------------------------------
   Phase 2 — Geometry metrics（要件定義書 v1.1 §4.2 §5.2 §18.1 §21〜§24 §28）
     · 現在描画中の多面体の実座標 → 幾何クラス A/B/C/D → 代表長 → 8 voice
     · M.update() には一切触れず、25Hz の独立した読み取り専用パスで算出する
     · Voices → Mix → Compressor → MasterGain → Destination
     · AudioNode は初期化時に1回だけ生成し、以後は再生成しない
     · σ / s は「実際の幾何長が変わる」経路でのみ音に効く。chaos は Phase 3
   ------------------------------------------------------------------------- */
const SOUND = {
  enabled:false,   /* ユーザーが ON にしているか */
  failed :false,   /* 初期化に失敗した。true 以降は何もしない */
  ctx    :null,
  mix    :null,    /* Voice Mix        */
  comp   :null,    /* Compressor（limiter設定） */
  master :null,    /* Master Gain（fade用。Compressor の後段） */
  voices :[],      /* 8。{ osc, gain, filter, last } */
  lastUpdate:0,    /* 25Hz スロットリング（ctx.currentTime 基準） */
  primed :false    /* 初回は瞬時設定、以後は smoothing */
};
const SND_MASTER = 0.16;   /* Master Gain 上限。低めから開始する（§17） */
const SND_FADE   = 0.20;   /* fade in / out 秒（§17: 100〜300ms） */
const SND_F0     = 110.0;  /* 基準周波数（§4.2） */
const SND_LREF   = 1.2361; /* 基準長。中半径1の正二十面体の辺長（§4.2） */
const SND_DT     = 1/25;   /* Audio metrics 更新間隔 秒（§12） */
const SND_TC_F   = 0.08;   /* frequency の時定数（§24.3） */
const SND_TC_G   = 0.05;   /* gain の時定数（§24.3） */
const SND_EPS    = 1e-4;   /* 退化長のしきい値（§18.1） */
const SND_WBAND  = 0.02;   /* 退化長を重み0へ落とすなめらかな帯幅（モデル座標） */
const SND_GBASE  = 2.0;    /* voice gain 係数。最終正規化は Phase 4 */
const SND_M2     = 0.5;    /* 第2モードの相対音量。最終調整は Phase 4 */
/* 可聴域外は clamp せず gain をフェードする（§4.2） */
const SND_FLO = 3000, SND_FHI = 6000, SND_FMINF = 45, SND_FMIN = 26;

const sndBtn = document.getElementById('snd');
let sndSuspendTimer = 0;

function sndUI(){
  if(!sndBtn || SOUND.failed) return;
  sndBtn.textContent = SOUND.enabled ? 'SOUND — ON' : 'SOUND — OFF';
  sndBtn.setAttribute('aria-pressed', SOUND.enabled ? 'true' : 'false');
}
/* 失敗しても WebGL を止めない。console 出力は1回だけ（§18 / AC-13） */
function sndFail(err){
  if(SOUND.failed) return;
  SOUND.failed = true; SOUND.enabled = false;
  try{ if(SOUND.ctx && SOUND.ctx.close) SOUND.ctx.close(); }catch(e){}
  SOUND.ctx=null; SOUND.mix=null; SOUND.comp=null; SOUND.master=null; SOUND.voices=[];
  if(sndBtn){
    sndBtn.textContent='SOUND — N/A';
    sndBtn.setAttribute('aria-pressed','false');
    sndBtn.disabled = true;
  }
  console.warn('[TRANSFIGURATION] sonification disabled:', (err && err.message) ? err.message : err);
}
function sndInit(){
  const modal = mtResolve();   /* seam 1/4 — 既定 modal / ?timbre=raw（§12b / §8） */
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) throw new Error('AudioContext unavailable');
  const ctx = new AC();

  const mix = ctx.createGain();  mix.gain.value = 1;
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -12; comp.knee.value = 6; comp.ratio.value = 12;
  comp.attack.value = 0.003;   comp.release.value = 0.25;
  const master = ctx.createGain(); master.gain.value = 0;   /* 常に無音から */
  mix.connect(comp); comp.connect(master); master.connect(ctx.destination);

  const voices = [];
  for(let i=0;i<8;i++){
    const osc = ctx.createOscillator();  osc.type = 'sine';
    osc.frequency.value = SND_F0;         /* 実値は初回 sndTick() が設定する */
    const g = ctx.createGain();          g.gain.value = 0;
    /* 固定の安全ロールオフのみ。σ 連動 cutoff は Phase 3 */
    const f = ctx.createBiquadFilter();  f.type='lowpass'; f.frequency.value=5000; f.Q.value=0.7;
    osc.connect(g); g.connect(f); f.connect(mix);
    osc.start();                          /* 以後 stop しない。再生成もしない */
    const v = {osc:osc, gain:g, filter:f, last:0};
    if(modal) mtInitVoice(ctx, v, i);     /* seam 2/4 — 部分音は modal 時のみ（AC-M1） */
    voices.push(v);
  }
  SOUND.ctx=ctx; SOUND.mix=mix; SOUND.comp=comp; SOUND.master=master; SOUND.voices=voices;
  SOUND.primed=false; SOUND.lastUpdate=0;
}

/* --- 幾何クラス A/B/C/D -------------------------------------------------
   A : 原辺上の切り残し辺（30本）        τ=0.5 で 0 へ退化
   B : 頂点図形の辺（60本）              τ=0   で 0 へ退化
   C : kind=0 面（元の面由来の 2m 角形）
   D : kind=1 面（頂点図形）
   第1モード長 : A/B = 辺長、C/D = apex から面頂点までの距離
   第2モード長 : A/B = その辺を含む各面の中心→辺中点距離（apothem）
                 C/D = apex から辺中点までの距離
   いずれも現在の変形後座標から実測する。s≠1 でも固定式に頼らない。
   ---------------------------------------------------------------------- */
const SND_CLS = [];
for(let i=0;i<4;i++) SND_CLS.push({
  key:'ABCD'.charAt(i),
  L1:{n:0,s:0,mn:0,mx:0}, L2:{n:0,s:0,mn:0,mx:0},
  len:SND_LREF, len2:SND_LREF, raw:0, spread:1, weight:0
});
const sndOrd  = [0,1,2,3];   /* 第1モード長の降順 */
const sndOrd2 = [0,1,2,3];   /* 第2モード長の降順 */
function accReset(a){ a.n=0; a.s=0; a.mn=Infinity; a.mx=0; }
/* 退化長は「除外」ではなく重み 0 へなめらかに落とす。
   閾値で出し入れすると、退化辺が閾値をまたぐ瞬間に集計母集団が階段状に変わり、
   他の voice の周波数が跳ぶ（実測で最大 935 cent）。 */
function accAdd(a,v,w){
  if(!(v>0) || !isFinite(v)) return;
  if(w===undefined) w=sndSmooth(v/SND_WBAND);
  if(!(w>0)) return;
  a.n+=w; a.s+=w*Math.log(v);
  if(w>0.5){ if(v<a.mn)a.mn=v; if(v>a.mx)a.mx=v; }
}
function accLen(a){ return a.n>1e-6 ? Math.exp(a.s/a.n) : 0; }     /* 重み付き幾何平均 */
function accSpread(a){ return (a.n>1e-6 && a.mn>0 && a.mx>0) ? a.mx/a.mn : 1; }

/* 位相は τ/σ/s に依らず静的なので、分類はモデルごとに初回1回だけ作る（§23） */
function sndTables(M){
  if(M.__snd) return M.__snd;
  const K=M.K, pairs=K.pairs, faces=K.faces, kind=K.kind, n=pairs.length;
  const idx=new Map();
  for(let i=0;i<n;i++) idx.set(pairs[i][0]+','+pairs[i][1], i);
  const aE=[], bE=[], k0=[], k1=[];
  /* A: (v,w) と (w,v) を結ぶ辺 = 原辺上の切り残し */
  for(let i=0;i<n;i++){
    const j=idx.get(pairs[i][1]+','+pairs[i][0]);
    if(j!==undefined && i<j){ aE.push(i,j); }
  }
  for(let fi=0; fi<faces.length; fi++){
    if(kind[fi]===0){ k0.push(faces[fi]); }
    else{
      k1.push(faces[fi]);
      const f=faces[fi], m=f.length;                /* B: 頂点図形の辺 */
      for(let i=0;i<m;i++) bE.push(f[i], f[(i+1)%m]);
    }
  }
  M.__snd={ aE:aE, bE:bE, k0:k0, k1:k1, P:new Float64Array(n*3) };
  return M.__snd;
}
/* 描画側 update() の P とは別に、読み取り専用で再計算する。
   inset / lift / 面回転は入れない（chaos を音程へ漏らさない。§5.2 §6.4） */
function sndBuildP(M,T){
  const V=M.base.V, pairs=M.K.pairs, P=T.P, n=pairs.length;
  const sy=curSt, sxz=1/Math.sqrt(curSt);
  for(let i=0;i<n;i++){
    const a=V[pairs[i][0]], b=V[pairs[i][1]], o=i*3;
    P[o  ]=(a.x+(b.x-a.x)*curTau)*sxz;
    P[o+1]=(a.y+(b.y-a.y)*curTau)*sy;
    P[o+2]=(a.z+(b.z-a.z)*curTau)*sxz;
  }
}
function sndEdgeLen(P,i,j){
  const o=i*3,q=j*3, dx=P[q]-P[o], dy=P[q+1]-P[o+1], dz=P[q+2]-P[o+2];
  return Math.sqrt(dx*dx+dy*dy+dz*dz);
}
/* 面群を走査して、面クラス(cF)の第1・第2モード長と、辺クラスの第2モード長を集める。
   戻り値は面積合計（weight 用）。 */
function sndFaceLoop(P, faces, isK0, cA, cB, cF){
  let area=0;
  for(let fi=0; fi<faces.length; fi++){
    const f=faces[fi], m=f.length;
    let cx=0,cy=0,cz=0;
    for(let i=0;i<m;i++){ const o=f[i]*3; cx+=P[o]; cy+=P[o+1]; cz+=P[o+2]; }
    cx/=m; cy/=m; cz/=m;
    let nx=0,ny=0,nz=0;                                  /* Newell 法線 */
    for(let i=0;i<m;i++){
      const o=f[i]*3, q=f[(i+1)%m]*3;
      nx+=(P[o+1]-P[q+1])*(P[o+2]+P[q+2]);
      ny+=(P[o+2]-P[q+2])*(P[o]+P[q]);
      nz+=(P[o]-P[q])*(P[o+1]+P[q+1]);
    }
    const nl=Math.sqrt(nx*nx+ny*ny+nz*nz);
    area += nl*0.5;                                      /* |Newell|/2 = 面積 */
    let ux=0,uy=0,uz=0;
    if(nl>1e-12){ ux=nx/nl; uy=ny/nl; uz=nz/nl;
      if(ux*cx+uy*cy+uz*cz<0){ ux=-ux; uy=-uy; uz=-uz; } }
    let Rf=0;
    for(let i=0;i<m;i++){ const o=f[i]*3;
      const dx=P[o]-cx, dy=P[o+1]-cy, dz=P[o+2]-cz;
      const d=Math.sqrt(dx*dx+dy*dy+dz*dz); if(d>Rf) Rf=d; }
    const h=curSig*Rf;                                   /* apex = C + σ·Rf·N */
    const ax=cx+ux*h, ay=cy+uy*h, az=cz+uz*h;
    for(let i=0;i<m;i++){ const o=f[i]*3;                /* 第1モード長 */
      const dx=P[o]-ax, dy=P[o+1]-ay, dz=P[o+2]-az;
      accAdd(cF.L1, Math.sqrt(dx*dx+dy*dy+dz*dz)); }
    for(let i=0;i<m;i++){
      const o=f[i]*3, q=f[(i+1)%m]*3;
      const ex=P[q]-P[o], ey=P[q+1]-P[o+1], ez=P[q+2]-P[o+2];
      const ew=sndSmooth(Math.sqrt(ex*ex+ey*ey+ez*ez)/SND_WBAND);   /* 退化辺の重み */
      if(!(ew>0)) continue;
      const mx=(P[o]+P[q])*0.5, my=(P[o+1]+P[q+1])*0.5, mz=(P[o+2]+P[q+2])*0.5;
      accAdd(cF.L2, Math.sqrt((mx-ax)*(mx-ax)+(my-ay)*(my-ay)+(mz-az)*(mz-az)), ew);
      const apo=Math.sqrt((mx-cx)*(mx-cx)+(my-cy)*(my-cy)+(mz-cz)*(mz-cz));
      /* kind=0 面では辺が A(偶数位置) / B(奇数位置) と交互に並ぶ */
      if(isK0) accAdd((i&1)?cB.L2:cA.L2, apo, ew);
      else     accAdd(cB.L2, apo, ew);
    }
  }
  return area;
}
/* 幾何のみ。Audio には触れない（検証しやすいよう sndTick から分離） */
function sndMetrics(){
  const T=sndTables(curM), P=T.P;
  sndBuildP(curM,T);
  const A=SND_CLS[0], B=SND_CLS[1], C=SND_CLS[2], D=SND_CLS[3];
  accReset(A.L1); accReset(A.L2); accReset(B.L1); accReset(B.L2);
  accReset(C.L1); accReset(C.L2); accReset(D.L1); accReset(D.L2);

  for(let e=0;e<T.aE.length;e+=2) accAdd(A.L1, sndEdgeLen(P,T.aE[e],T.aE[e+1]));
  for(let e=0;e<T.bE.length;e+=2) accAdd(B.L1, sndEdgeLen(P,T.bE[e],T.bE[e+1]));
  const ar0=sndFaceLoop(P, T.k0, true,  A, B, C);
  const ar1=sndFaceLoop(P, T.k1, false, A, B, D);

  /* 退化したクラスは len / len2 を「前回値のまま保持」する。0 へ落とすと整列順が
     階段状に変わり、他 voice の周波数が跳ぶ（実測で 752 cent）。消音は weight 側で行う。 */
  for(let i=0;i<4;i++){
    const c=SND_CLS[i];
    c.raw=accLen(c.L1);
    const l2=accLen(c.L2);
    if(c.raw>0) c.len =c.raw;      /* 周波数用 */
    if(l2   >0) c.len2=l2;
    c.spread=accSpread(c.L1);
  }
  /* weight: 辺群は総辺長比、面群は総面積比。辺:面 = 1:1。
     退化クラスは raw=0 → weight=0 となり、周波数を動かさずに無音化する。 */
  const wa=(T.aE.length/2)*A.raw, wb=(T.bE.length/2)*B.raw, se=wa+wb;
  A.weight = se>0 ? 0.5*wa/se : 0;
  B.weight = se>0 ? 0.5*wb/se : 0;
  const sf=ar0+ar1;
  C.weight = sf>0 ? 0.5*ar0/sf : 0;
  D.weight = sf>0 ? 0.5*ar1/sf : 0;
  /* 長さ降順に整列。kind index へは固定しない（§23.5 §24.2）。
     順序交差は必ず両者の長さが一致する点で起きるため、可聴ジャンプにならない。
     第2モードは独立に整列する。A と B は正則切頂点で第1モード長が一致するため
     整列順が入れ替わるが、両者の第2モード長は一致しない。第1モードの順序に
     第2モードを従わせると、そこで1オクターブ超の跳躍とフリッカーが発生する。 */
  sndOrd[0]=0;  sndOrd[1]=1;  sndOrd[2]=2;  sndOrd[3]=3;
  sndOrd2[0]=0; sndOrd2[1]=1; sndOrd2[2]=2; sndOrd2[3]=3;
  sndOrd.sort (function(x,y){ return SND_CLS[y].len  - SND_CLS[x].len;  });
  sndOrd2.sort(function(x,y){ return SND_CLS[y].len2 - SND_CLS[x].len2; });
}
function sndSmooth(x){ x = x<0?0:(x>1?1:x); return x*x*(3-2*x); }
function sndGate(f){
  if(!isFinite(f) || f<=0) return 0;
  if(f>=SND_FHI || f<=SND_FMIN) return 0;
  let g=1;
  if(f>SND_FLO)   g  = sndSmooth((SND_FHI-f)/(SND_FHI-SND_FLO));
  if(f<SND_FMINF) g *= sndSmooth((f-SND_FMIN)/(SND_FMINF-SND_FMIN));
  return g;
}
/* 退化長は周波数を据え置き gain のみ 0 へ。非有限値は AudioParam へ渡さない（§18.1） */
function sndApply(v, L, w, mw, t){
  let f=0;
  if(L>SND_EPS && isFinite(L)){
    const x=SND_F0*(SND_LREF/L);
    if(isFinite(x) && x>0) f=x;
  }
  let g=0;
  if(f>0){ v.last=f; g=SND_GBASE*w*mw*sndGate(f); }
  let fv=v.last;
  if(!isFinite(fv) || fv<=0) fv=SND_F0;
  /* AudioParam の数値安全域。musical な clamp ではない —
     この範囲へ丸められる voice は sndGate により既に gain 0 になっている */
  if(fv>20000) fv=20000; else if(fv<10) fv=10;
  if(!isFinite(g) || g<0) g=0;
  if(!isFinite(fv) || !isFinite(g)) return;      /* 最終防御 */
  if(SOUND.primed){
    v.osc.frequency.setTargetAtTime(fv, t, SND_TC_F);
    v.gain.gain.setTargetAtTime(g, t, SND_TC_G);
  }else{
    v.osc.frequency.setValueAtTime(fv, t);
    v.gain.gain.setValueAtTime(g, t);
  }
  if(MT.on) mtApply(v, fv, g, t);   /* seam 3/4 — 部分音（§12b / §3.1 §4） */
}
function sndTick(){
  if(!SOUND.enabled || SOUND.failed || !SOUND.ctx || !curM) return;   /* OFF時は何もしない */
  const ctx=SOUND.ctx, now=ctx.currentTime;
  if(SOUND.primed && now-SOUND.lastUpdate < SND_DT) return;           /* 25Hz */
  SOUND.lastUpdate=now;
  sndMetrics();
  if(MT.on) mtPool();   /* seam 4/4 — 候補プールを確定（§12b / §3.1） */
  for(let k=0;k<4;k++){
    const c1=SND_CLS[sndOrd[k]];                 /* 偶数 voice = 第1モード */
    sndApply(SOUND.voices[2*k],   c1.len,  c1.weight, 1.0,    now);
    const c2=SND_CLS[sndOrd2[k]];                /* 奇数 voice = 第2モード */
    sndApply(SOUND.voices[2*k+1], c2.len2, c2.weight, SND_M2, now);
  }
}
/* 現在値から連続に繋いでランプする。瞬間切替を行わない（§17 / AC-10） */
function sndRamp(target){
  if(!SOUND.ctx || !SOUND.master) return;
  const t = SOUND.ctx.currentTime, p = SOUND.master.gain;
  const now = (typeof p.value === 'number' && isFinite(p.value)) ? p.value : 0;
  p.cancelScheduledValues(t);
  p.setValueAtTime(now, t);
  p.linearRampToValueAtTime(target, t + SND_FADE);
}
function setSound(on){
  if(SOUND.failed) return;
  try{ if(on && !SOUND.ctx) sndInit(); }
  catch(err){ sndFail(err); return; }
  if(!SOUND.ctx) return;

  SOUND.enabled = on; sndUI();
  const ctx = SOUND.ctx;

  if(on){
    clearTimeout(sndSuspendTimer);
    /* ON の瞬間は現在の幾何へ瞬時に合わせる（master gain 0 のため無音のうちに確定）*/
    const go = ()=>{ if(!SOUND.enabled) return;
                     SOUND.primed=false; sndTick(); SOUND.primed=true;
                     sndRamp(SND_MASTER); };
    if(ctx.state === 'suspended' && ctx.resume){
      let p; try{ p = ctx.resume(); }catch(err){ sndFail(err); return; }
      if(p && p.then) p.then(go, err=>sndFail(err)); else go();
    } else go();
  }else{
    sndRamp(0);
    clearTimeout(sndSuspendTimer);
    /* fade out 完了後に suspend して Audio 処理負荷を落とす（P0-6 / §16.1） */
    sndSuspendTimer = setTimeout(function(){
      if(!SOUND.enabled && SOUND.ctx && SOUND.ctx.suspend){
        try{ const q = SOUND.ctx.suspend(); if(q && q.catch) q.catch(function(){}); }catch(e){}
      }
    }, SND_FADE*1000 + 80);
  }
}
if(sndBtn) sndBtn.addEventListener('click', function(){ setSound(!SOUND.enabled); });

/* ---------- 12b. Modal Timbre（feature/modal-timbre）----------------------
   要件定義書 docs/modal-timbre-requirements-v0.3.md

   Phase M1 — 比率導出（§3.1）＋部分音ノード（固定ゲイン）
     · 既定で部分音を有効化する（本作の音）。?timbre=raw で RAW v1 の音に戻る
     · raw 指定時は部分音ノードを生成せず、実行経路も RAW と同一に保つ
     · 自己相似方式 { r, r² }。r = 自分より1段だけ短い代表長との比（§3.1）
     · 候補は 3 つの門を通す（§3.4）
         weight > 0        無音クラスの凍結 len2 を弾く
         L_k ≥ ε·L_i       退化フェード中の比率発散を弾く
         r > 1 + MT_RMIN   自クラス・同長クラスの ULP 混入を弾く
     · ゲインは ρ_base 固定。σ 連動とパワー和正規化は Phase M2（§4）
     · §12 の RAW 実装（sndTables / sndBuildP / sndFaceLoop / sndMetrics）は
       読むだけで一切改変しない（§2-5）
     · 既存の固定フィルタ（lowpass 5000Hz / Q 0.7）も変更しない。modal の
       高域調整は ρ_sig 側のみで行う（§10-4）
   このブロックと §12 内の 4 箇所の seam を消せば RAW v1 に戻る。
   ------------------------------------------------------------------------- */
const MT = {
  on      : true,    /* modal か。sndInit() の冒頭で1回だけ確定する（§8） */
  resolved: false
};
/* §10 で確定した定数。ε / δ / ρ は Phase M3 で調整する（§10-5 §10-6） */
const MT_EPS   = 0.05;  /* 候補比率の相対しきい値。r ≤ 1/MT_EPS = 20（§3.1） */
const MT_DELTA = 0.05;  /* r→1 フェードの帯幅（§6.2） */
const MT_WGATE = 0.02;  /* 候補クラスの weight フェード帯。プール離脱を無音で吸収 */
const MT_RMIN  = 1e-9;  /* r の下限。自クラス・同長クラスを候補から外す（§3.1）。
                           sndApply は f=SND_F0*(SND_LREF/L)、mtPool は
                           SND_F0*SND_LREF/len と結合順が違うため、同じクラスでも
                           最終 1ulp がずれる。素の fk>fi だと自クラスが r=1+1e-16 の
                           「最小の候補」として常に勝ち、本来の候補を覆い隠す。 */
const MT_RHO_B = 0.35;  /* ρ_base（§4）        */
const MT_RHO_S = 0.25;  /* ρ_sig。ρ 上限 0.6（§4） */
const MT_NPART = 2;     /* voice あたりの部分音数。§7 の縮退時は 1 へ落とす */

/* URL パラメータは1回だけ読み、以後は定数として扱う。実行中の切替は行わない（§8）。
   既定は modal（本作の音）。?timbre=raw のときだけ RAW v1 の音に戻す。
   例外時は既定側（modal）へ倒す。 */
function mtResolve(){
  if(MT.resolved) return MT.on;
  MT.resolved = true;
  try{
    const q = (window.location && window.location.search) || '';
    MT.on = !/(?:^|[?&])timbre=raw(?:&|$)/.test(q);
  }catch(e){ MT.on = true; }
  if(!MT.on) console.info('[TRANSFIGURATION] timbre: RAW v1 (tag raw-v1 相当)');
  return MT.on;
}
/* 部分音 Osc / Gain を生成し v.parts へ格納する。voice Filter の前段で合流させ、
   既存の安全ロールオフを部分音にも効かせる（§5）。MT.on のときだけ呼ばれる。
   voice のモードは index の偶奇で静的に決まる（偶数=第1モード / 奇数=第2モード）。 */
function mtInitVoice(ctx, v, i){
  v.mode = (i & 1) ? 1 : 0;            /* MT_POOL の添字。0=第1モード, 1=第2モード */
  const parts = [];
  for(let k=0;k<MT_NPART;k++){
    const o = ctx.createOscillator();  o.type='sine';  o.frequency.value = SND_F0;
    const g = ctx.createGain();        g.gain.value = 0;
    o.connect(g); g.connect(v.filter);
    o.start();                          /* 以後 stop しない。再生成もしない（§4.1） */
    parts.push({osc:o, gain:g, last:SND_F0});
  }
  v.parts = parts;
}

/* 候補プール（§3.1）。4 クラスの代表長をモード別に周波数へ直して保持する。
   f = f0·L_ref/L なので L_i/L_k = f_k/f_i。すなわち比率探索は
   「自分より高い最寄りの周波数を選ぶ」ことと同値で、除算を1回に減らせる。

   要件定義書 §3.1 は「退化クラスは len が 0 付近まで追随してから凍結するので
   ε 条件だけで排除できる」としているが、これは第1モードにしか当てはまらない。
   第2モード長 len2 は面の apothem / apex→辺中点距離であり、辺長が 0 へ潰れても
   0 にならない。accAdd の辺重み ew が 0 になって集計母集団から外れ、len2 は
   「無音なのに通常の大きさのまま」凍結する（F3）。この値をそのまま候補にすると、
   鳴っていないクラス由来の部分音が出る。したがって weight でも門を設ける。
   ただし weight は 0 へなめらかに落ちてから厳密に 0 になるため、プールからの
   離脱を周波数ジャンプにしないよう、部分音側を MT_WGATE でフェードさせる
   （v1.1 §18.1 の「退化は gain fade で処理し周波数は跳ばさない」に合わせる）。 */
const MT_POOL  = [new Float64Array(4), new Float64Array(4)];
const MT_POOLW = new Float64Array(4);   /* クラス weight。モード共通 */
function mtPool(){
  for(let j=0;j<4;j++){
    const c = SND_CLS[j];
    const w = (c.weight > 0 && isFinite(c.weight)) ? c.weight : 0;
    MT_POOLW[j] = w;
    MT_POOL[0][j] = (w>0 && c.len  > SND_EPS && isFinite(c.len )) ? SND_F0*SND_LREF/c.len  : 0;
    MT_POOL[1][j] = (w>0 && c.len2 > SND_EPS && isFinite(c.len2)) ? SND_F0*SND_LREF/c.len2 : 0;
  }
}
/* 候補クラスの index を返す。−1 で候補なし（案A。§3.1-2 / §10-7）。
   下限 f_i·(1+MT_RMIN) は自クラスと同長クラスを除外する。ti / td のように
   L_A = L_B が厳密に成り立つ状態では、§3.1 の狭義不等式 L_k < L_i どおり
   互いを候補にしない。上限 f_i/ε より r ≤ 1/MT_EPS = 20（AC-M6）。 */
function mtCand(mode, fi){
  if(!(fi>0) || !isFinite(fi)) return -1;
  const pool = MT_POOL[mode], lo = fi*(1+MT_RMIN), hi = fi/MT_EPS;
  let bi = -1, bf = 0;
  for(let j=0;j<4;j++){
    const fk = pool[j];
    if(fk > lo && fk <= hi && (bi < 0 || fk < bf)){ bi = j; bf = fk; }
  }
  return bi;
}
/* 自己相似 { r, r² } を部分音へ反映する（§3.1）。
   fv = sndApply が確定した基音周波数, g0 = 基音ゲイン, t = ctx.currentTime。
   非有限値は AudioParam へ渡さず、周波数は直前値を保持する（§3.3 / v1.1 §18.1）。 */
function mtApply(v, fv, g0, t){
  const parts = v.parts;
  if(!parts) return;
  const ci = mtCand(v.mode, fv);
  const r  = (ci >= 0) ? MT_POOL[v.mode][ci]/fv : 0;
  /* r→1 近傍は基音と部分音が同一周波数へ重なりコヒーレント加算になる（§6.2）。
     ti / td は A=B=C が同一長のため r≈1 となり、浮動小数の揺れで候補が 25Hz で
     出入りしてフリッカーする。§11 では M2 の項目だが、この guard が無いと M1 の
     聴感評価そのものが成立しないため前倒しで入れる。
     wc は候補クラスが退化していく際のフェード。プール離脱を無音側で吸収する。 */
  const wc = (ci >= 0) ? sndSmooth(MT_POOLW[ci]/MT_WGATE) : 0;
  const wr = (r > 1) ? sndSmooth((r-1)/MT_DELTA)*wc : 0;
  let rk = 1;
  for(let k=0;k<parts.length;k++){
    const p = parts[k];
    rk *= r;                                   /* k=0 → r , k=1 → r² */
    let f = 0, g = 0;
    if(r > 1){
      const x = fv*rk;
      if(isFinite(x) && x > 0){
        f = x;
        /* Phase M1 は ρ_base 固定。σ 連動とパワー和正規化は Phase M2（§4） */
        g = g0 * Math.pow(MT_RHO_B, k+1) * wr * sndGate(x);
      }
    }
    if(f > 0) p.last = f;
    let pf = p.last;
    if(!isFinite(pf) || pf <= 0) pf = SND_F0;
    if(pf > 20000) pf = 20000; else if(pf < 10) pf = 10;
    if(!isFinite(g) || g < 0) g = 0;
    if(!isFinite(pf) || !isFinite(g)) continue;      /* 最終防御（AC-M6） */
    if(SOUND.primed){
      p.osc.frequency.setTargetAtTime(pf, t, SND_TC_F);
      p.gain.gain.setTargetAtTime(g, t, SND_TC_G);
    }else{
      p.osc.frequency.setValueAtTime(pf, t);
      p.gain.gain.setValueAtTime(g, t);
    }
  }
}

/* ---------- 13. ループ ---------------------------------------------------- */
const clock=new THREE.Clock();
let prevPlate=0, scanMode='open';
function frame(){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05, clock.getDelta()), t=clock.elapsedTime;
  applySequence(dt);
  sndTick();          /* 内部で 25Hz スロットリング。Sound OFF 時は即 return */

  const capY = OBJ_Y - objRadius - 0.30 - CAP_WORLD_H*0.5;
  capSprite.position.y += (capY - capSprite.position.y)*0.09;

  scrollOff += dt*0.30*(1-lockAmt);
  if(lockAmt>0.35) scrollOff += (Math.round(scrollOff)-scrollOff)*0.14;
  ringMat.uniforms.uOffset.value=scrollOff;
  ringMat.uniforms.uFlat.value=lockAmt;
  const plate=smoother(Math.min(1, Math.max(0,(lockAmt-0.72)/0.28)));
  ringMat.uniforms.uOpacity.value=1-plate;
  ringMesh.visible = plate<0.995;
  capSprite.material.opacity=plate;

  /* --- piece：上からスキャンして現れ、中央で閉じて消える --- */
  if(plate>prevPlate+1e-6) scanMode='open';
  else if(plate<prevPlate-1e-6) scanMode='close';
  prevPlate=plate;
  const hh=Math.tan(camera.fov*Math.PI/360)*PIECE_DIST, hw=hh*camera.aspect;
  const boxHalf=Math.min(hh*0.30, hw*0.20);
  pieceGroup.position.set(hw-boxHalf-hh*0.12, hh*0.40, -PIECE_DIST);
  if(plate>0.001){
    if(capKey!==pieceKey || Math.abs(boxHalf-pieceBox)>1e-4){
      pieceKey=capKey; pieceBox=boxHalf; rebuildPieces(capKey, boxHalf);
    }
    let top, bot;
    if(scanMode==='open'){ top=1.02; bot=1.02-2.04*plate; }
    else                 { top=1.02*plate; bot=-1.02*plate; }
    pieceMat.uniforms.uTop.value=top/1.0;
    pieceMat.uniforms.uBot.value=bot/1.0;
    pieceMat.uniforms.uOpacity.value=1;
    pieceMat.uniforms.uTime.value=t;
    const lo=Math.min(1,Math.max(0,(plate-0.02)/0.16))*(1-smoother(Math.min(1,Math.max(0,(plate-0.86)/0.14))));
    scanMatA.uniforms.uOpacity.value=lo;
    scanMatB.uniforms.uOpacity.value=(scanMode==='close')?lo:0;
    const lw=pieceHalfX*2.3+boxHalf*0.25;
    scanA.scale.set(lw, boxHalf*0.10, 1);
    scanB.scale.set(lw, boxHalf*0.10, 1);
    scanA.position.set(0, bot*pieceHalfY, 0.001);
    scanB.position.set(0, top*pieceHalfY, 0.001);
    pieceLabel.scale.set(boxHalf*1.30, boxHalf*1.30*96/512, 1);
    pieceLabel.position.set(0, -pieceHalfY-boxHalf*0.30, 0);
    pieceLabel.material.opacity=Math.max(0,(plate-0.55)/0.45);
    pieceGroup.visible=true;
  } else {
    pieceGroup.visible=false;
  }

  idle+=dt;
  if(!dragging && idle>2.0) tTheta += dt*0.075;
  zoomMul += (tZoom-zoomMul)*0.10;
  tDist = fitDistance()*zoomMul;
  theta+=(tTheta-theta)*0.07; phi+=(tPhi-phi)*0.07; dist+=(tDist-dist)*0.06;
  const sp=Math.sin(phi);
  camera.position.set(dist*sp*Math.sin(theta), dist*Math.cos(phi), dist*sp*Math.cos(theta));
  camera.lookAt(0, OBJ_Y*0.42, 0);
  root.rotation.y=t*0.045;
  root.rotation.x=Math.sin(t*0.13)*0.075;
  filmMat.uniforms.uTime.value=t;

  updateRing(lockAmt, objRadius*RING_K, capSprite.position.y, t);

  renderer.setRenderTarget(rtScene);
  renderer.clear(true,true,true);
  renderer.render(scene, camera);
  compMat.uniforms.tBase.value=rtScene.texture;
  compMat.uniforms.uTime.value=t;
  renderer.setRenderTarget(null);
  renderer.clear(true,true,true);
  renderer.render(quadScene, quadCam);
}
frame();
</script>
