<script>
/* =========================================================================
   TRANSFIGURATION — 多面体変相
     p(v,w) = M·( v + τ(w−v) )   apex = C + σ·R_f·N   M = diag(s^-1/2,s,s^-1/2)
   ========================================================================= */
const V3 = THREE.Vector3;
const PHI = (1 + Math.sqrt(5)) / 2;

/* ---------- 1. 多面体 ----------------------------------------------------- */
function fixWinding(V,F){
  const n=new V3(), c=new V3();
  for(const f of F){
    n.set(0,0,0); c.set(0,0,0);
    for(let i=0;i<f.length;i++){
      const p=V[f[i]], q=V[f[(i+1)%f.length]];
      n.x+=(p.y-q.y)*(p.z+q.z); n.y+=(p.z-q.z)*(p.x+q.x); n.z+=(p.x-q.x)*(p.y+q.y);
      c.add(p);
    }
    if(n.dot(c)<0) f.reverse();
  }
}
function icosahedron(){
  const raw=[[0,1,PHI],[0,1,-PHI],[0,-1,PHI],[0,-1,-PHI],
             [1,PHI,0],[1,-PHI,0],[-1,PHI,0],[-1,-PHI,0],
             [PHI,0,1],[-PHI,0,1],[PHI,0,-1],[-PHI,0,-1]];
  const V = raw.map(p=>new V3(p[0],p[1],p[2]));
  const n=V.length, d2=(a,b)=>V[a].distanceToSquared(V[b]);
  let min=Infinity;
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++) min=Math.min(min,d2(i,j));
  const isE=(a,b)=>Math.abs(d2(a,b)-min)<1e-6;
  const F=[];
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)for(let k=j+1;k<n;k++)
    if(isE(i,j)&&isE(j,k)&&isE(i,k)) F.push([i,j,k]);
  fixWinding(V,F); return {V,F};
}
function topology(P){
  const {V,F}=P, dirFace=new Map();
  F.forEach((f,fi)=>{ for(let i=0;i<f.length;i++) dirFace.set(f[i]+','+f[(i+1)%f.length],fi); });
  const nextIn=(fi,v)=>{ const f=F[fi]; return f[(f.indexOf(v)+1)%f.length]; };
  const start=V.map(()=>-1);
  F.forEach((f,fi)=>f.forEach(v=>{ if(start[v]<0) start[v]=fi; }));
  const nbrs=[], fcyc=[];
  V.forEach((_,v)=>{
    const nb=[], fc=[]; let fi=start[v], g=0;
    do{ fc.push(fi); const w=nextIn(fi,v); nb.push(w); fi=dirFace.get(w+','+v); }
    while(fi!==start[v] && ++g<24);
    nbrs.push(nb); fcyc.push(fc);
  });
  return {nbrs,fcyc};
}
function dual(P,T){
  const V=P.F.map(f=>{ const c=new V3(); f.forEach(i=>c.add(P.V[i]));
                       return c.divideScalar(f.length).normalize(); });
  const F=T.fcyc.map(fc=>fc.slice());
  fixWinding(V,F); return {V,F};
}
function normalizeMidradius(P){
  const seen=new Set(); let s=0,n=0;
  for(const f of P.F) for(let i=0;i<f.length;i++){
    const a=f[i], b=f[(i+1)%f.length], k=Math.min(a,b)+'_'+Math.max(a,b);
    if(seen.has(k)) continue; seen.add(k);
    s += P.V[a].clone().add(P.V[b]).multiplyScalar(0.5).length(); n++;
  }
  P.V.forEach(v=>v.multiplyScalar(n/s)); return P;
}
function truncation(P,T){
  const idx=new Map(), pairs=[];
  P.V.forEach((_,v)=>T.nbrs[v].forEach(w=>{ idx.set(v+','+w,pairs.length); pairs.push([v,w]); }));
  const faces=[], kind=[];
  P.F.forEach(f=>{ const p=[];
    for(let i=0;i<f.length;i++){ const a=f[i], b=f[(i+1)%f.length];
      p.push(idx.get(a+','+b), idx.get(b+','+a)); }
    faces.push(p); kind.push(0); });
  P.V.forEach((_,v)=>{ faces.push(T.nbrs[v].map(w=>idx.get(v+','+w))); kind.push(1); });
  const S=pairs.map(pr=>P.V[pr[0]].clone().lerp(P.V[pr[1]],0.25));
  fixWinding(S,faces);
  return {faces,kind,pairs};
}

/* ---------- 2. 描画モデル ------------------------------------------------ */
const INSET=0.905;
function buildModel(base){
  const T=topology(base), K=truncation(base,T), nP=K.pairs.length;
  let tri=0, seg=0; K.faces.forEach(f=>{ tri+=f.length; seg+=f.length; });
  const pos=new Float32Array(tri*9), nor=new Float32Array(tri*9);
  const aRim=new Float32Array(tri*3), aType=new Float32Array(tri*3);
  const lpos=new Float32Array(seg*6), ppos=new Float32Array(nP*3);
  { let o=0; K.faces.forEach((f,fi)=>{ for(let i=0;i<f.length;i++){
      aRim[o]=1; aRim[o+1]=0; aRim[o+2]=0;
      aType[o]=aType[o+1]=aType[o+2]=K.kind[fi]; o+=3; } }); }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('normal',  new THREE.BufferAttribute(nor,3));
  g.setAttribute('aRim',    new THREE.BufferAttribute(aRim,1));
  g.setAttribute('aType',   new THREE.BufferAttribute(aType,1));
  const gl=new THREE.BufferGeometry();
  gl.setAttribute('position',new THREE.BufferAttribute(lpos,3));
  const gp=new THREE.BufferGeometry();
  gp.setAttribute('position',new THREE.BufferAttribute(ppos,3));

  const P=[]; for(let i=0;i<nP;i++) P.push(new V3());
  const Q=[]; for(let i=0;i<12;i++) Q.push(new V3());
  const C=new V3(), N=new V3(), tmp=new V3(), rot=new V3(),
        AP=new V3(), e1=new V3(), e2=new V3(), tn=new V3();
  let maxR=0;

  function update(tau, sigma, st, chaos){
    const pairs=K.pairs, faces=K.faces;
    const sy=st, sxz=1/Math.sqrt(st);
    maxR=0;
    for(let i=0;i<nP;i++){
      const a=base.V[pairs[i][0]], b=base.V[pairs[i][1]];
      P[i].set((a.x+(b.x-a.x)*tau)*sxz, (a.y+(b.y-a.y)*tau)*sy, (a.z+(b.z-a.z)*tau)*sxz);
      ppos[i*3]=P[i].x; ppos[i*3+1]=P[i].y; ppos[i*3+2]=P[i].z;
      maxR=Math.max(maxR,P[i].length());
    }
    const inset=INSET-0.115*chaos, lift=0.115*chaos, th=0.34*chaos;
    const cs=Math.cos(th), sn=Math.sin(th);
    let o=0, lo=0;
    for(let fi=0; fi<faces.length; fi++){
      const f=faces[fi], m=f.length;
      C.set(0,0,0); for(let i=0;i<m;i++) C.add(P[f[i]]); C.divideScalar(m);
      N.set(0,0,0);
      for(let i=0;i<m;i++){ const p=P[f[i]], q=P[f[(i+1)%m]];
        N.x+=(p.y-q.y)*(p.z+q.z); N.y+=(p.z-q.z)*(p.x+q.x); N.z+=(p.x-q.x)*(p.y+q.y); }
      if(N.lengthSq()<1e-12) N.copy(C);
      N.normalize(); if(N.dot(C)<0) N.negate();
      const cx=C.x+N.x*lift, cy=C.y+N.y*lift, cz=C.z+N.z*lift;
      while(Q.length<m) Q.push(new V3());
      let Rf=0;
      for(let i=0;i<m;i++){
        tmp.subVectors(P[f[i]],C).multiplyScalar(inset);
        rot.crossVectors(N,tmp);
        Q[i].set(cx+tmp.x*cs+rot.x*sn, cy+tmp.y*cs+rot.y*sn, cz+tmp.z*cs+rot.z*sn);
        Rf=Math.max(Rf, tmp.length());
      }
      AP.set(cx+N.x*sigma*Rf, cy+N.y*sigma*Rf, cz+N.z*sigma*Rf);
      maxR=Math.max(maxR, AP.length());
      for(let i=0;i<m;i++){
        const A=Q[i], B=Q[(i+1)%m];
        e1.subVectors(A,AP); e2.subVectors(B,AP);
        tn.crossVectors(e1,e2);
        if(tn.lengthSq()<1e-14) tn.copy(N); else {
          tn.normalize();
          if(tn.x*(AP.x+A.x+B.x)+tn.y*(AP.y+A.y+B.y)+tn.z*(AP.z+A.z+B.z) < 0) tn.negate();
        }
        pos[o]=AP.x; pos[o+1]=AP.y; pos[o+2]=AP.z;
        pos[o+3]=A.x; pos[o+4]=A.y; pos[o+5]=A.z;
        pos[o+6]=B.x; pos[o+7]=B.y; pos[o+8]=B.z;
        for(let j=0;j<3;j++){ nor[o+j*3]=tn.x; nor[o+j*3+1]=tn.y; nor[o+j*3+2]=tn.z; }
        o+=9;
        lpos[lo]=A.x; lpos[lo+1]=A.y; lpos[lo+2]=A.z;
        lpos[lo+3]=B.x; lpos[lo+4]=B.y; lpos[lo+5]=B.z;
        lo+=6;
      }
    }
    g.attributes.position.needsUpdate=true; g.attributes.normal.needsUpdate=true;
    gl.attributes.position.needsUpdate=true; gp.attributes.position.needsUpdate=true;
    g.computeBoundingSphere();
  }
  return {geom:g, lineGeom:gl, pointGeom:gp, update, radius:()=>maxR, K, base};
}

/* 代表面を 1 枚ずつ取り出して 2D に開く（piece 表示用） */
function facePieces(M, tau, sigma, st){
  const K=M.K, base=M.base, sy=st, sxz=1/Math.sqrt(st);
  const P=K.pairs.map(pr=>{
    const a=base.V[pr[0]], b=base.V[pr[1]];
    return new V3((a.x+(b.x-a.x)*tau)*sxz,(a.y+(b.y-a.y)*tau)*sy,(a.z+(b.z-a.z)*tau)*sxz);
  });
  const out=[];
  [0,1].forEach(kind=>{
    const fi=K.kind.indexOf(kind); if(fi<0) return;
    const f=K.faces[fi], m=f.length;
    const C=new V3(); f.forEach(i=>C.add(P[i])); C.divideScalar(m);
    const N=new V3();
    for(let i=0;i<m;i++){ const p=P[f[i]], q=P[f[(i+1)%m]];
      N.x+=(p.y-q.y)*(p.z+q.z); N.y+=(p.z-q.z)*(p.x+q.x); N.z+=(p.x-q.x)*(p.y+q.y); }
    if(N.lengthSq()<1e-12) return;
    N.normalize(); if(N.dot(C)<0) N.negate();
    /* 重複頂点を畳む（τ=0 / 0.5 で 2n 角形が n 角形へ退化する） */
    const raw=[];
    for(let i=0;i<m;i++){
      const q=P[f[i]].clone().sub(C).multiplyScalar(INSET);
      if(raw.length===0 || q.distanceTo(raw[raw.length-1])>1e-5) raw.push(q);
    }
    if(raw.length>1 && raw[0].distanceTo(raw[raw.length-1])<1e-5) raw.pop();
    if(raw.length<3) return;
    let Rf=0; raw.forEach(q=>Rf=Math.max(Rf,q.length()));
    let pts;
    if(sigma>1e-3){                      /* 星形時の実際の構成面＝角錐の側面三角形 */
      const ap=N.clone().multiplyScalar(sigma*Rf);
      pts=[ap, raw[0], raw[1]];
    } else pts=raw;
    /* 面内の直交基底へ射影 */
    const o=new V3(); pts.forEach(p=>o.add(p)); o.divideScalar(pts.length);
    let ex=null;
    for(let i=0;i<pts.length && !ex;i++){
      const d=pts[(i+1)%pts.length].clone().sub(pts[i]);
      if(d.lengthSq()>1e-8) ex=d.normalize();
    }
    if(!ex) return;
    const nn=pts.length===3
      ? pts[1].clone().sub(pts[0]).cross(pts[2].clone().sub(pts[0])).normalize()
      : N.clone();
    const ey=nn.clone().cross(ex).normalize();
    let p2=pts.map(p=>{ const d=p.clone().sub(o); return [d.dot(ex), d.dot(ey)]; });
    /* 向きの正準化：反時計回りに揃え、第1頂点を真上に固定する */
    let A2=0;
    for(let i=0;i<p2.length;i++){ const a=p2[i], b=p2[(i+1)%p2.length];
      A2 += a[0]*b[1] - b[0]*a[1]; }
    if(A2<0) p2=p2.map(q=>[q[0], -q[1]]);
    const th0=Math.atan2(p2[0][1], p2[0][0]), rr=Math.PI/2-th0;
    const cr=Math.cos(rr), sr=Math.sin(rr);
    p2=p2.map(q=>[q[0]*cr-q[1]*sr, q[0]*sr+q[1]*cr]);
    out.push(p2);
  });
  return out;
}

/* ---------- 3. 共通シェーダ関数（GLSL 断片） ------------------------------ */
const GLSL_LIB = `
vec3 thinFilm(float cosI, float d){
  float n = 1.42;
  float cosT = sqrt(max(1.0 - (1.0 - cosI*cosI)/(n*n), 0.0));
  float delta = 2.0 * n * d * cosT;
  return 0.5 - 0.5*cos(6.2831853*delta/vec3(612.0,549.0,464.0) + 3.1415927);
}
float lobe(vec3 R, vec3 L, float p){ return pow(max(dot(R, normalize(L)), 0.0), p); }
vec3 pearlSky(vec3 R, float t){
  float h = R.y*0.5 + 0.5;
  float drift = 0.5*sin(R.x*2.4 + t*0.19) + 0.5*sin(R.z*2.9 - t*0.15);
  float v = clamp(h + drift*0.14, 0.0, 1.0);
  vec3 c =      vec3(1.00,0.88,0.79);
  c = mix(c, vec3(1.00,0.82,0.87), smoothstep(0.02,0.24,v));
  c = mix(c, vec3(0.86,0.81,1.00), smoothstep(0.22,0.44,v));
  c = mix(c, vec3(0.73,0.90,1.00), smoothstep(0.42,0.62,v));
  c = mix(c, vec3(0.80,1.00,0.95), smoothstep(0.60,0.80,v));
  c = mix(c, vec3(1.00,0.98,0.93), smoothstep(0.78,1.00,v));
  float curtain = pow(max(sin(v*8.0 + drift*1.7 + t*0.30), 0.0), 1.5);
  float veil    = pow(max(sin(v*3.0 - t*0.10), 0.0), 1.2);
  float horizon = exp(-pow(R.y*5.5, 2.0));
  return c * (0.40 + 0.68*curtain + 0.28*veil) + vec3(0.85,0.90,1.0)*horizon*0.22;
}
vec3 specular(vec3 R){
  vec3 s = vec3(0.0);
  s += vec3(1.00,0.98,0.95) * lobe(R, vec3( 0.32, 0.88, 0.35), 1400.0) * 5.2;
  s += vec3(0.92,0.96,1.00) * lobe(R, vec3(-0.72, 0.26, 0.64),  320.0) * 1.9;
  s += vec3(1.00,0.90,0.86) * lobe(R, vec3( 0.12,-0.74,-0.66),  160.0) * 1.2;
  s += vec3(0.95,1.00,0.98) * lobe(R, vec3(-0.15, 0.10,-0.98), 2600.0) * 3.4;
  return s;
}`;

const FILM_VS = `
attribute float aRim; attribute float aType;
varying vec3 vN; varying vec3 vW; varying float vRim; varying float vType;
void main(){
  vec4 wp = modelMatrix * vec4(position,1.0);
  vW = wp.xyz;
  vN = normalize(mat3(modelMatrix) * normal);
  vRim = aRim; vType = aType;
  gl_Position = projectionMatrix * viewMatrix * wp;
}`;
const FILM_FS = `
precision highp float;
uniform float uTime, uChaos;
varying vec3 vN; varying vec3 vW; varying float vRim; varying float vType;
` + GLSL_LIB + `
void main(){
  vec3 N = normalize(vN);
  vec3 V = normalize(cameraPosition - vW);
  if(!gl_FrontFacing) N = -N;
  float ndv  = clamp(dot(N,V), 0.0, 1.0);
  float fres = 0.05 + 0.95*pow(1.0-ndv, 5.0);
  vec3  R    = reflect(-V, N);
  float d = 330.0 + 145.0*sin(vW.y*2.0 + vW.x*0.9 + uTime*0.16)
                  +  90.0*sin(vW.z*3.2 - uTime*0.11)
                  +  50.0*vType + 55.0*uChaos;
  vec3 film = mix(vec3(1.0), thinFilm(ndv, d), 0.62);
  vec3 sky  = pearlSky(R, uTime);
  vec3 spec = specular(R) * film;
  vec3 col  = film * sky * 1.80 + sky * fres * 0.60 + film * 0.09;
  col += spec * (0.30 + 0.70*fres);
  float edge = pow(1.0 - vRim, 10.0);
  col += vec3(1.00,0.96,0.94) * edge * (0.22 + 0.55*uChaos);
  float sl = dot(spec, vec3(0.2126,0.7152,0.0722));
  float a = clamp(0.075 + 0.55*fres + 0.40*edge + 0.30*min(sl,1.0), 0.0, 1.0);
  gl_FragColor = vec4(col, a);
}`;

/* piece：平面だがわずかにドーム状の法線を与えてハイライトを走らせる */
const PIECE_VS = `
attribute vec2 aLoc;
varying vec2 vLoc; varying vec3 vN; varying vec3 vW;
void main(){
  vLoc = aLoc;
  vec3 n = normalize(vec3(aLoc.x*1.25, aLoc.y*1.25, 1.0));
  vN = normalize(mat3(modelMatrix) * n);
  vec4 wp = modelMatrix * vec4(position,1.0);
  vW = wp.xyz;
  gl_Position = projectionMatrix * viewMatrix * wp;
}`;
const PIECE_FS = `
precision highp float;
uniform float uTime, uOpacity, uTop, uBot;
varying vec2 vLoc; varying vec3 vN; varying vec3 vW;
` + GLSL_LIB + `
void main(){
  if(vLoc.y > uTop || vLoc.y < uBot) discard;
  vec3 N = normalize(vN);
  vec3 V = normalize(cameraPosition - vW);
  if(!gl_FrontFacing) N = -N;
  float ndv  = clamp(dot(N,V), 0.0, 1.0);
  float fres = 0.05 + 0.95*pow(1.0-ndv, 5.0);
  vec3  R    = reflect(-V, N);
  float d = 330.0 + 150.0*sin(vLoc.x*2.6 + vLoc.y*1.9 + uTime*0.42);
  vec3 film = mix(vec3(1.0), thinFilm(ndv, d), 0.62);
  vec3 sky  = pearlSky(R, uTime);
  vec3 spec = specular(R) * film;
  vec3 col  = film * sky * 1.80 + sky * fres * 0.60 + film * 0.09;
  col += spec * (0.30 + 0.70*fres);
  float eT = exp(-abs(vLoc.y-uTop)*70.0);
  float eB = exp(-abs(vLoc.y-uBot)*70.0);
  col += vec3(0.86,0.94,1.00) * (eT+eB) * 0.42;
  float sl = dot(spec, vec3(0.2126,0.7152,0.0722));
  float a = clamp(0.40 + 0.34*fres + 0.28*min(sl,1.0) + 0.45*(eT+eB), 0.0, 1.0) * uOpacity;
  gl_FragColor = vec4(col, a);
}`;

const TEXT_VS = `
varying vec2 vUv; varying vec3 vN; varying vec3 vW;
void main(){ vUv=uv; vN=normal; vW=position;
  gl_Position = projectionMatrix * viewMatrix * vec4(position,1.0); }`;
const TEXT_FS = `
precision highp float;
uniform sampler2D tText; uniform float uOpacity; uniform float uOffset; uniform float uFlat;
varying vec2 vUv; varying vec3 vN; varying vec3 vW;
void main(){
  vec4 c = texture2D(tText, vec2(vUv.x + uOffset, vUv.y));
  float f = dot(normalize(vN), normalize(cameraPosition - vW));
  float face = mix(smoothstep(-0.02, 0.34, f), 1.0, uFlat);
  float a = c.a * uOpacity * face;
  if(a < 0.004) discard;
  gl_FragColor = vec4(vec3(1.0), a);
}`;

const SCAN_VS = `varying vec2 vUv; void main(){ vUv=uv;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`;
const SCAN_FS = `
precision highp float; uniform float uOpacity; varying vec2 vUv;
void main(){
  float g = exp(-pow((vUv.y-0.5)*9.5, 2.0));
  float ends = smoothstep(0.0,0.06,vUv.x)*smoothstep(1.0,0.94,vUv.x);
  gl_FragColor = vec4(vec3(0.84,0.93,1.00), g*ends*uOpacity);
}`;

const QUAD_VS = `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }`;
const COMP_FS = `
precision highp float;
uniform sampler2D tBase; uniform float uTime; uniform vec2 uRes;
varying vec2 vUv;
vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14), 0.0, 1.0); }
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
void main(){
  vec3 base = texture2D(tBase, vUv).rgb;
  float r = length((vUv-0.5)*vec2(uRes.x/uRes.y,1.0));
  vec3 bg = mix(vec3(0.052,0.050,0.062), vec3(0.004,0.004,0.008), smoothstep(0.05,0.95,r));
  bg += vec3(0.030,0.028,0.036) * pow(max(1.0-r*1.35,0.0), 3.0);
  vec3 col = bg + base;
  col = aces(col * 1.04);
  col *= 1.0 - 0.40*smoothstep(0.35,1.05,r);
  col += (hash(vUv*uRes + fract(uTime)*137.0) - 0.5) * 0.028;
  gl_FragColor = vec4(col, 1.0);
}`;

const _p=new V3(),_ax=new V3(),_no=new V3(),_fp=new V3(),_fc=new V3(),
      _cr=new V3(),_cu=new V3(),_cd=new V3(),_tq=new THREE.Quaternion(),
      _te=new THREE.Euler(),_a=new V3(),_b=new V3();
function updateRing(m, ringR, capY, t){
  _te.set(0.34+0.07*Math.sin(t*0.21), t*0.17, -0.13+0.06*Math.cos(t*0.17));
  _tq.setFromEuler(_te);
  camera.updateMatrixWorld();
  _cr.setFromMatrixColumn(camera.matrixWorld,0).normalize();
  _cu.setFromMatrixColumn(camera.matrixWorld,1).normalize();
  _cd.setFromMatrixColumn(camera.matrixWorld,2).normalize();
  const hRing=RING_AR*2*Math.PI*ringR, hFlat=RING_AR*CAP_WORLD_W;
  const h=hRing+(hFlat-hRing)*m;
  _fc.set(0, capY, 0);
  for(let i=0;i<=RING_N;i++){
    const u=i/RING_N, th=u*Math.PI*2;
    _p.set(Math.cos(th)*ringR,0,Math.sin(th)*ringR).applyQuaternion(_tq); _p.y+=OBJ_Y;
    _ax.set(0,1,0).applyQuaternion(_tq);
    _no.set(Math.cos(th),0,Math.sin(th)).applyQuaternion(_tq);
    _fp.copy(_cr).multiplyScalar((u-0.5)*CAP_WORLD_W).add(_fc);
    const px=_p.x+(_fp.x-_p.x)*m, py=_p.y+(_fp.y-_p.y)*m, pz=_p.z+(_fp.z-_p.z)*m;
    _a.set(_ax.x+(_cu.x-_ax.x)*m,_ax.y+(_cu.y-_ax.y)*m,_ax.z+(_cu.z-_ax.z)*m).normalize();
    _b.set(_no.x+(_cd.x-_no.x)*m,_no.y+(_cd.y-_no.y)*m,_no.z+(_cd.z-_no.z)*m).normalize();
    const o0=(i*2)*3,o1=(i*2+1)*3;
    ringPos[o0]=px+_a.x*h*0.5; ringPos[o0+1]=py+_a.y*h*0.5; ringPos[o0+2]=pz+_a.z*h*0.5;
    ringPos[o1]=px-_a.x*h*0.5; ringPos[o1+1]=py-_a.y*h*0.5; ringPos[o1+2]=pz-_a.z*h*0.5;
    ringNor[o0]=_b.x; ringNor[o0+1]=_b.y; ringNor[o0+2]=_b.z;
    ringNor[o1]=_b.x; ringNor[o1+1]=_b.y; ringNor[o1+2]=_b.z;
  }
  ringGeo.attributes.position.needsUpdate=true;
  ringGeo.attributes.normal.needsUpdate=true;
}

function rebuildPieces(key, boxHalf){
  const S=PIECE_STATE[key];
  if(!S){ pieceGeo.setDrawRange(0,0); return; }
  let raw=facePieces(MODEL[S.b], S.t, S.g, S.s);
  if(!raw.length){ pieceGeo.setDrawRange(0,0); return; }
  /* 大きい順に並べて左右の配置を固定する */
  raw=raw.map(p=>{ let r=0; p.forEach(q=>r=Math.max(r,Math.hypot(q[0],q[1]))); return {p:p,r:r}; })
         .sort((a,b)=>b.r-a.r);
  const polys=raw.map(o=>o.p), rad=raw.map(o=>o.r);
  const maxR=Math.max.apply(null,rad);
  const gap=maxR*0.42;
  let total=0; rad.forEach(r=>total+=2*r); total+=gap*(polys.length-1);
  const k=boxHalf/Math.max(total/2, maxR*1.02);
  let cur=-total/2, n=0;
  const hy=maxR*k;
  polys.forEach((p,i)=>{
    const ox=(cur+rad[i])*k; cur+=2*rad[i]+gap;
    const cx=0, cy=0;
    for(let j=0;j<p.length;j++){
      const a=p[j], b=p[(j+1)%p.length];
      const tri=[[cx,cy],[a[0],a[1]],[b[0],b[1]]];
      for(const v of tri){
        if(n>=PIECE_MAX) break;
        const X=ox+v[0]*k, Y=v[1]*k;
        piecePos[n*3]=X; piecePos[n*3+1]=Y; piecePos[n*3+2]=0;
        pieceLoc[n*2]=X/boxHalf; pieceLoc[n*2+1]=Y/Math.max(hy,1e-4);
        n++;
      }
    }
  });
  pieceGeo.attributes.position.needsUpdate=true;
  pieceGeo.attributes.aLoc.needsUpdate=true;
  pieceGeo.setDrawRange(0,n);
  pieceHalfY=hy; pieceHalfX=total/2*k;
}

function applySequence(dt){
  if(!paused) phase += (dt/SEG_DUR)*dir;
  if(phase>=SEGS.length){ phase=SEGS.length-(phase-SEGS.length); dir=-1; }
  if(phase<0){ phase=-phase; dir=1; }
  const si=Math.min(SEGS.length-1, Math.max(0, Math.floor(phase)));
  const g=SEGS[si];
  const raw=Math.min(1, Math.max(0, phase-si));
  const u=smoother(Math.min(1, Math.max(0,(raw-0.20)/0.60)));
  const chaos=Math.sin(Math.PI*u);
  const tau=g.A.t+(g.B.t-g.A.t)*u;
  const sig=g.A.g+(g.B.g-g.A.g)*u;
  const st =Math.exp(Math.log(g.A.s)+(Math.log(g.B.s)-Math.log(g.A.s))*u);

  MODEL.ico.group.visible=(g.b==='ico');
  MODEL.dod.group.visible=(g.b==='dod');
  const M=MODEL[g.b];
  M.update(tau, sig, st, chaos);
  const k=Math.pow(TARGET_R/Math.max(M.radius(),1e-3), 0.74);
  root.scale.setScalar(k);
  objRadius=M.radius()*k;
  filmMat.uniforms.uChaos.value=chaos;
  curM=M; curTau=tau; curSig=sig; curSt=st;

  lockAmt = smoother(Math.min(1, Math.max(0, 1 - 5.5*Math.min(u, 1-u))));
  const key=(u<0.5)?g.fk:g.tk;
  if(key!==capKey){ capKey=key; capSprite.material.map=CAP_TEX[key];
                    capSprite.material.needsUpdate=true; }
  elTau.innerHTML='τ <b>'+tau.toFixed(3)+'</b>　σ <b>'+sig.toFixed(3)+'</b>　s <b>'+st.toFixed(3)+'</b>';
}

/* ---------- 10. コンポジット --------------------------------------------- */
const quadCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const quadScene=new THREE.Scene();
const compMat=new THREE.ShaderMaterial({vertexShader:QUAD_VS, fragmentShader:COMP_FS,
  uniforms:{tBase:{value:null}, uTime:{value:0}, uRes:{value:new THREE.Vector2()}}});
quadScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), compMat));
let rtScene=null;

/* ---------- 11. カメラ ---------------------------------------------------- */
let theta=0.6, phi=1.30, tTheta=theta, tPhi=phi;
let zoomMul=1, tZoom=1, dist=7, tDist=7;
let dragging=false, lx=0, ly=0, idle=0;
function fitDistance(){
  const half=Math.tan(camera.fov*Math.PI/360);
  const outer=Math.max(objRadius, objRadius*RING_K*(1-0.55*lockAmt));
  const topY=OBJ_Y+outer;
  const botY=capSprite.position.y-CAP_WORLD_H/2;
  const needV=Math.max(Math.abs(topY),Math.abs(botY))+0.18;
  const needH=Math.max(outer, CAP_WORLD_W/2)+0.18;
  return Math.max(needV/half, needH/(half*camera.aspect));
}
function resize(){
  const w=innerWidth,h=innerHeight,dpr=Math.min(devicePixelRatio,2);
  renderer.setSize(w,h);
  camera.aspect=w/h; camera.updateProjectionMatrix();
  const W=Math.floor(w*dpr), H=Math.floor(h*dpr);
  if(rtScene) rtScene.dispose();
  rtScene=new THREE.WebGLRenderTarget(W,H,{minFilter:THREE.LinearFilter,
    magFilter:THREE.LinearFilter, format:THREE.RGBAFormat});
  compMat.uniforms.uRes.value.set(W,H);
}
addEventListener('resize', resize); resize();
const el=renderer.domElement;
el.addEventListener('pointerdown', e=>{ dragging=true; lx=e.clientX; ly=e.clientY; idle=0; });
addEventListener('pointermove', e=>{ if(!dragging) return;
  tTheta-=(e.clientX-lx)*0.006;
  tPhi=Math.max(0.85,Math.min(2.30,tPhi-(e.clientY-ly)*0.006));
  lx=e.clientX; ly=e.clientY; idle=0; });
addEventListener('pointerup', ()=>dragging=false);
addEventListener('pointercancel', ()=>dragging=false);
el.addEventListener('wheel', e=>{ e.preventDefault();
  tZoom=Math.max(0.62,Math.min(2.4,tZoom+e.deltaY*0.0012)); idle=0; }, {passive:false});
addEventListener('keydown', e=>{ if(e.code==='Space'){ e.preventDefault(); paused=!paused; } });

/* ---------- 12. ループ ---------------------------------------------------- */
const clock=new THREE.Clock();
let prevPlate=0, scanMode='open';
function frame(){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05, clock.getDelta()), t=clock.elapsedTime;
  applySequence(dt);

  const capY = OBJ_Y - objRadius - 0.30 - CAP_WORLD_H*0.5;
  capSprite.position.y += (capY - capSprite.position.y)*0.09;

  scrollOff += dt*0.30*(1-lockAmt);
  if(lockAmt>0.35) scrollOff += (Math.round(scrollOff)-scrollOff)*0.14;
  ringMat.uniforms.uOffset.value=scrollOff;
  ringMat.uniforms.uFlat.value=lockAmt;
  const plate=smoother(Math.min(1, Math.max(0,(lockAmt-0.72)/0.28)));
  ringMat.uniforms.uOpacity.value=1-plate;
  ringMesh.visible = plate<0.995;
  capSprite.material.opacity=plate;

  /* --- piece：上からスキャンして現れ、中央で閉じて消える --- */
  if(plate>prevPlate+1e-6) scanMode='open';
  else if(plate<prevPlate-1e-6) scanMode='close';
  prevPlate=plate;
  const hh=Math.tan(camera.fov*Math.PI/360)*PIECE_DIST, hw=hh*camera.aspect;
  const boxHalf=Math.min(hh*0.30, hw*0.20);
  pieceGroup.position.set(hw-boxHalf-hh*0.12, hh*0.40, -PIECE_DIST);
  if(plate>0.001){
    if(capKey!==pieceKey || Math.abs(boxHalf-pieceBox)>1e-4){
      pieceKey=capKey; pieceBox=boxHalf; rebuildPieces(capKey, boxHalf);
    }
    let top, bot;
    if(scanMode==='open'){ top=1.02; bot=1.02-2.04*plate; }
    else                 { top=1.02*plate; bot=-1.02*plate; }
    pieceMat.uniforms.uTop.value=top/1.0;
    pieceMat.uniforms.uBot.value=bot/1.0;
    pieceMat.uniforms.uOpacity.value=1;
    pieceMat.uniforms.uTime.value=t;
    const lo=Math.min(1,Math.max(0,(plate-0.02)/0.16))*(1-smoother(Math.min(1,Math.max(0,(plate-0.86)/0.14))));
    scanMatA.uniforms.uOpacity.value=lo;
    scanMatB.uniforms.uOpacity.value=(scanMode==='close')?lo:0;
    const lw=pieceHalfX*2.3+boxHalf*0.25;
    scanA.scale.set(lw, boxHalf*0.10, 1);
    scanB.scale.set(lw, boxHalf*0.10, 1);
    scanA.position.set(0, bot*pieceHalfY, 0.001);
    scanB.position.set(0, top*pieceHalfY, 0.001);
    pieceLabel.scale.set(boxHalf*1.30, boxHalf*1.30*96/512, 1);
    pieceLabel.position.set(0, -pieceHalfY-boxHalf*0.30, 0);
    pieceLabel.material.opacity=Math.max(0,(plate-0.55)/0.45);
    pieceGroup.visible=true;
  } else {
    pieceGroup.visible=false;
  }

  idle+=dt;
  if(!dragging && idle>2.0) tTheta += dt*0.075;
  zoomMul += (tZoom-zoomMul)*0.10;
  tDist = fitDistance()*zoomMul;
  theta+=(tTheta-theta)*0.07; phi+=(tPhi-phi)*0.07; dist+=(tDist-dist)*0.06;
  const sp=Math.sin(phi);
  camera.position.set(dist*sp*Math.sin(theta), dist*Math.cos(phi), dist*sp*Math.cos(theta));
  camera.lookAt(0, OBJ_Y*0.42, 0);
  root.rotation.y=t*0.045;
  root.rotation.x=Math.sin(t*0.13)*0.075;
  filmMat.uniforms.uTime.value=t;

  updateRing(lockAmt, objRadius*RING_K, capSprite.position.y, t);

  renderer.setRenderTarget(rtScene);
  renderer.clear(true,true,true);
  renderer.render(scene, camera);
  compMat.uniforms.tBase.value=rtScene.texture;
  compMat.uniforms.uTime.value=t;
  renderer.setRenderTarget(null);
  renderer.clear(true,true,true);
  renderer.render(quadScene, quadCam);
}
frame();
</script>
